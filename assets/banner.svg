<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <!-- Accent Wave Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Pill Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Architectural Background Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Vector Waveforms & Telemetry Traces -->
  <g>
    <!-- Secondary Wave -->
    <path fill="none" stroke="url(#pinkGrad)" stroke-width="2" opacity="0.35" d="M 0 340 Q 150 280, 300 340 T 600 340 T 900 340 T 1200 320" />

    <!-- Primary Vibration Telemetry Wave -->
    <path fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.8" d="M 0 310 Q 120 230, 240 310 T 480 310 T 720 310 T 960 310 T 1200 310" />

    <!-- Dashed Circuit Trace Path -->
    <path fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" d="M 40 350 L 220 350 L 290 280 L 520 280 L 590 340 L 1160 340" />

    <!-- Static Signal Pulse Dots along Trace -->
    <circle cx="220" cy="350" r="4" fill="#38bdf8" />
    <circle cx="290" cy="280" r="4" fill="#38bdf8" />
    <circle cx="520" cy="280" r="4" fill="#38bdf8" />
    <circle cx="590" cy="340" r="4" fill="#38bdf8" />
  </g>

  <!-- Multi-layered Telemetry Nodes -->
  <!-- Node 1 -->
  <g transform="translate(290, 280)">
    <circle r="14" fill="#06b6d4" opacity="0.15" />
    <circle r="9" fill="#06b6d4" opacity="0.35" />
    <circle r="4" fill="#38bdf8" />
  </g>

  <!-- Node 2 -->
  <g transform="translate(520, 280)">
    <circle r="14" fill="#3b82f6" opacity="0.15" />
    <circle r="9" fill="#3b82f6" opacity="0.35" />
    <circle r="4" fill="#60a5fa" />
  </g>

  <!-- Node 3 -->
  <g transform="translate(590, 340)">
    <circle r="14" fill="#8b5cf6" opacity="0.15" />
    <circle r="9" fill="#8b5cf6" opacity="0.35" />
    <circle r="4" fill="#a78bfa" />
  </g>

  <!-- Foreground Content: Pill Badges & Titles -->
  <!-- Top Category Pill Badges -->
  <g transform="translate(80, 65)">
    <!-- Pill 1: Industry 4.0 -->
    <rect x="0" y="0" width="130" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="65" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Industry 4.0</text>

    <!-- Pill 2: AI Anomaly Detection -->
    <rect x="145" y="0" width="170" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="230" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">AI Anomaly Detection</text>

    <!-- Pill 3: Vibration Analysis -->
    <rect x="330" y="0" width="155" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="407" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Vibration Analysis</text>

    <!-- Pill 4: RUL Prediction -->
    <rect x="500" y="0" width="145" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="572" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RUL Prediction</text>

    <!-- Pill 5: Digital Twins -->
    <rect x="660" y="0" width="135" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="727" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Digital Twins</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">Awesome Industrial Predictive Maintenance</text>
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects for Condition Monitoring</text>
  </g>

  <!-- Key Highlights List -->
  <g transform="translate(80, 245)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1">
    <text x="0" y="0">
      <tspan fill="#38bdf8" font-weight="bold">✓</tspan> Machinery Fault Diagnostics &nbsp;&nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8" font-weight="bold">✓</tspan> Deep Learning &amp; Bayesian Evidence Fusion &nbsp;&nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8" font-weight="bold">✓</tspan> ISO 20816 Compliance &nbsp;&nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8" font-weight="bold">✓</tspan> IIoT Telemetry
    </text>
  </g>
</svg>
