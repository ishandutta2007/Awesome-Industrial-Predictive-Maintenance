<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Glow Filter for Nodes -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes nodeGlow {
      0%, 100% { r: 6px; opacity: 0.6; }
      50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 10px #06b6d4); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    .bg-rect { fill: url(#bgGrad); }
    .animated-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .wave-line { fill: none; stroke: url(#cyanGrad); stroke-width: 2.5; opacity: 0.55; }
    .wave-pulse { fill: none; stroke: url(#purpleGrad); stroke-width: 2; opacity: 0.4; }
    .circuit-line { fill: none; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 8 6; animation: dashMove 15s linear infinite; }
    .node-dot { fill: #38bdf8; animation: nodeGlow 4s ease-in-out infinite; }
    .particle { fill: #e0e7ff; animation: floatParticle 6s ease-in-out infinite; }

    .title-main { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-sub { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; letter-spacing: 0.2px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #38bdf8; }
    .badge-bg { fill: rgba(14, 165, 233, 0.12); stroke: rgba(56, 189, 248, 0.35); stroke-width: 1; rx: 14; }
  </style>

  <!-- Background -->
  <rect class="bg-rect" width="1200" height="400" rx="16" />

  <!-- Background Grid -->
  <g class="animated-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Animated Sensor Waveforms & Signal Traces in Lower Section -->
  <g filter="url(#glow)">
    <!-- Vibration / Acoustic Waveform 1 -->
    <path class="wave-line" d="M 0 310 Q 150 250, 300 310 T 600 310 T 900 310 T 1200 310" />
    <!-- Anomaly / RUL Prediction Waveform 2 -->
    <path class="wave-pulse" d="M 0 340 Q 200 390, 400 330 T 800 340 T 1200 320" />
    <path class="circuit-line" d="M 50 350 L 250 350 L 320 280 L 550 280 L 620 340 L 1150 340" />
  </g>

  <!-- Glowing Sensor telemetry nodes -->
  <circle cx="320" cy="280" r="7" class="node-dot" filter="url(#strongGlow)" />
  <circle cx="550" cy="280" r="7" class="node-dot" filter="url(#strongGlow)" style="animation-delay: 1.5s;" />
  <circle cx="620" cy="340" r="7" class="node-dot" filter="url(#strongGlow)" style="animation-delay: 3s;" />

  <!-- Ambient Floating Particles -->
  <circle cx="100" cy="100" r="2.5" class="particle" style="animation-delay: 0s;" />
  <circle cx="950" cy="120" r="3" class="particle" style="animation-delay: 2s;" />
  <circle cx="1100" cy="220" r="2" class="particle" style="animation-delay: 4s;" />
  <circle cx="400" cy="70" r="3.5" class="particle" style="animation-delay: 1s;" />

  <!-- FOREGROUND CONTENT: Header Badges, Title, Subtitle -->
  <!-- Top Category Pill Badges -->
  <g transform="translate(80, 75)">
    <!-- Pill 1 -->
    <rect class="badge-bg" x="0" y="0" width="135" height="28" />
    <text class="badge-text" x="67" y="18" text-anchor="middle">⚡ Industry 4.0</text>

    <!-- Pill 2 -->
    <rect class="badge-bg" x="150" y="0" width="175" height="28" />
    <text class="badge-text" x="237" y="18" text-anchor="middle">🧠 AI Anomaly Detection</text>

    <!-- Pill 3 -->
    <rect class="badge-bg" x="340" y="0" width="165" height="28" />
    <text class="badge-text" x="422" y="18" text-anchor="middle">📊 Vibration Analysis</text>

    <!-- Pill 4 -->
    <rect class="badge-bg" x="520" y="0" width="165" height="28" />
    <text class="badge-text" x="602" y="18" text-anchor="middle">⏱️ RUL Prediction</text>

    <!-- Pill 5 -->
    <rect class="badge-bg" x="700" y="0" width="145" height="28" />
    <text class="badge-text" x="772" y="18" text-anchor="middle">🌐 Digital Twins</text>
  </g>

  <!-- Main Title & Subtitle (Explicitly positioned in foreground) -->
  <g transform="translate(80, 165)">
    <text class="title-main" x="0" y="0">Awesome Industrial Predictive Maintenance ⚙️</text>
    <text class="title-sub" x="0" y="38">Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Projects for Condition Monitoring</text>
  </g>

  <!-- Sub-bullet highlights -->
  <g transform="translate(80, 245)">
    <text font-family="'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1" x="0" y="0">
      <tspan fill="#38bdf8">✓</tspan> Machinery Fault Diagnostics &nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8">✓</tspan> Deep Learning &amp; Bayesian Evidence Fusion &nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8">✓</tspan> ISO 20816 Compliance &nbsp;&nbsp;&nbsp;
      <tspan fill="#38bdf8">✓</tspan> IIoT Telemetry
    </text>
  </g>
</svg>
